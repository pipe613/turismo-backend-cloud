<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Editar Tour | TurismoPro</title>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex items-center justify-center p-6">

    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        <div class="bg-slate-900 p-6">
            <h2 class="text-2xl font-bold text-white"><i class="fas fa-edit mr-3 text-blue-400"></i>Editar Tour</h2>
            <p class="text-slate-400 text-sm mt-1">Modificando: <span class="text-white font-semibold">{{ tour.nombre }}</span></p>
        </div>

        <form method="POST" class="p-8 space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label class="text-sm font-semibold text-slate-600">Nombre del Tour</label>
                    <input name="nombre" value="{{ tour.nombre }}" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                
                <div>
                    <label class="text-sm font-semibold text-slate-600">Destino</label>
                    <input name="destino" value="{{ tour.destino }}" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                
                <div>
                    <label class="text-sm font-semibold text-slate-600">Duración (días)</label>
                    <input type="number" name="duracion_dias" value="{{ tour.duracion_dias }}" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                
                <div class="md:col-span-2">
                    <label class="text-sm font-semibold text-slate-600">Precio (USD)</label>
                    <input type="number" name="precio" value="{{ tour.precio }}" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
            </div>

            <div class="flex items-center space-x-4 mt-8">
                <a href="{% url 'admin_panel' %}" class="flex-1 text-center py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition">
                    Cancelar
                </a>
                <button type="submit" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-lg shadow-blue-200">
                    Guardar Cambios
                </button>
            </div>
        </form>
    </div>

</body>
</html>
