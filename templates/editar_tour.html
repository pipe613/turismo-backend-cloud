<!DOCTYPE html>
<html lang="es">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
    <div class="max-w-md mx-auto bg-white p-6 rounded shadow">
        <h2 class="text-xl font-bold mb-4">Editar: {{ tour.nombre }}</h2>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <input name="nombre" value="{{ tour.nombre }}" class="w-full border p-2 rounded">
            <input name="destino" value="{{ tour.destino }}" class="w-full border p-2 rounded">
            <input type="number" name="precio" value="{{ tour.precio }}" class="w-full border p-2 rounded">
            <button type="submit" class="bg-blue-600 text-white w-full p-2 rounded">Guardar Cambios</button>
        </form>
    </div>
</body>
</html>
